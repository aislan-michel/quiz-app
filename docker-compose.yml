services:
  mysql-development:
    image: mysql:8.0.17
    environment:
      MYSQL_ROOT_PASSWORD: numsey
      MYSQL_DATABASE: quiz-db
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pnumsey"]
      interval: 5s
      timeout: 5s
      retries: 20

  quiz-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql-development:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DBHOST: mysql-development
      DBPORT: 3306
      DBPASSWORD: numsey
    ports:
      - "5000:8080"